global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'voice-gateway'
    static_configs:
      - targets: ['gateway:8443', 'localhost:8443']
    metrics_path: '/metrics'

  - job_name: 'voice-stt-service'
    static_configs:
      - targets: ['stt-service:8001', 'localhost:8001']
    metrics_path: '/metrics'

  - job_name: 'voice-mt-service'
    static_configs:
      - targets: ['mt-service:8002', 'localhost:8002']
    metrics_path: '/metrics'
