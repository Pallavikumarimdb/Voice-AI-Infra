[project]
name = "voice-agent-service"
version = "0.1.0"
description = "Japanese Debt Collection Voice Agent Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "openai>=1.12.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
