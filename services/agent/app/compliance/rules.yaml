# ILLUSTRATIVE ONLY. Not legal advice. Verify real regulations before any real use.
# Japanese Collections Voice Agent - Compliance Rules
# ==============================================================================

calling_hours:
  start: "08:00"
  end: "21:00"
  timezone: "Asia/Tokyo"

contact_limits:
  max_attempts_per_day: 3
  max_attempts_per_week: 7

verification:
  required_fields: 2
  max_attempts: 3
  allowed_fields:
    - "dob"
    - "postal_code"
    - "name_confirmation"

disclosure:
  must_precede:
    - "amount"
    - "creditor_details"
  required_elements:
    - "caller_identity"
    - "purpose"
    - "recording_notice"

stop_contact:
  block_all_channels: true
  immediate_exit: true

negotiation:
  max_discount_pct: 0
  min_down_payment_pct: 10
  max_installments: 12
  max_duration_days: 180

forbidden_content:
  - "threats"
  - "shaming"
  - "false_urgency"
  - "disclosure_to_third_party"
  - "implying_legal_action_not_authorized"
